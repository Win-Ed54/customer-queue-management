<!DOCTYPE html>
<html lang="en">        
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de turnos para atención al cliente</title>
    <description>Sistema simple de gestion de turnos para atención al cliente</description> 
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <form action="/src/app.js" method="post"></form>
        <ul>
            <li>
                <label for="CustomerName">Nombre del cliente: </label>
                <input type="text" id="customerName" name="Customer_name" />
            </li>

            <li>
                <label for="ServiceType">Tipo de Servicio: </label>
                <input list="Service" id="serviceType" name="Service" placeholder="Escribe para buscar: " />
                <datalist id="Service">
                    <option value="Consulta General">
                    <option value="Soporte Técnico">
                    <option value="Facturación">
                    <option value="Reclamaciones">
                    <option value="Otros">
                </datalist>
            </li>
        </ul>
    </div>      
    <p>Prioridad de Cliente</p>
    <input type="checkbox" id="priorityCustomer" name="priority" value="high">
    <label for="priorityCustomer">Alta Prioridad</label><br>  
    <p>Enviar ticket</p>
    <button type="submit">Enviar</button>
    <p>Mensajes de Errores</p>
    <div id="messages"></div>
    <p>Tickets Pendientes</p>
    <div id="pendingTickets"></div>
    



  </body>


</html>
